<g text-anchor="middle" font-size="18"><text x="118" y="388" font-size="20" font-weight="700">PostgreSQL</text><text x="118" y="415">Same primary</text><text x="118" y="442">One main slot</text><text x="347" y="341" font-weight="700">SQL chunk reader</text><text x="347" y="369">Short, fresh reads</text><text x="347" y="457" font-weight="700">CDC decoder</text><text x="347" y="485">Committed events</text><text x="579" y="388" font-size="20" font-weight="700">Merger</text><text x="579" y="415">LOW / HIGH</text><text x="579" y="442">One output order</text><text x="801" y="388" font-size="20" font-weight="700">Durable stage</text><text x="801" y="415">Output + cursor</text><text x="801" y="442">Atomic progress</text><text x="1014" y="388" font-size="20" font-weight="700">Dispatcher</text><text x="1014" y="415">Kafka or</text><text x="1014" y="442">Elasticsearch</text></g>
