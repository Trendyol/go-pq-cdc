<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Existing snapshot startup and proposed online architecture</title>
<desc id="desc">The existing path creates a slot and completes the snapshot before replication starts. The proposal runs a SQL chunk reader and a replication decoder into one merger, followed by durable staging and a destination. Safe acknowledgements return from recoverable progress to the source.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526777"/></marker><marker id="safe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f75"/></marker></defs>
<rect width="1120" height="640" rx="16" fill="#f6f8fa"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#142d40">
<text x="28" y="38" font-size="24" font-weight="700">Remove the whole-snapshot delay, not the durability boundary</text>
<text x="28" y="72" font-size="18" font-weight="700" fill="#945816">CURRENT · initial + CDC startup</text>
<g fill="#fff" stroke="#c6d0d9" stroke-width="2">
<rect x="28" y="92" width="180" height="100" rx="9"/><rect x="244" y="92" width="180" height="100" rx="9"/><rect x="460" y="92" width="180" height="100" rx="9"/><rect x="676" y="92" width="180" height="100" rx="9"/><rect x="892" y="92" width="200" height="100" rx="9"/>
</g>
