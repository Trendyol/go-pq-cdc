<path d="M28 205H640" stroke="#c98937" stroke-width="5"/><text x="28" y="232" font-size="18" fill="#945816">No streaming reader during this interval</text>
<text x="28" y="280" font-size="18" font-weight="700" fill="#087f75">PROPOSED · one owner, one window, durable staged profile</text>
