<text x="458" y="578" text-anchor="middle" font-size="18" fill="#087f75" font-weight="700">ACK only through the contiguous recoverable source prefix</text>
<text x="28" y="614" font-size="17" fill="#526777">Staging absorbs a finite backlog. Slow persistence, long transactions, or exhausted budgets can still increase retained WAL.</text>
