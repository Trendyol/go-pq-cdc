services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: snapshot_example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snapshot_example"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
