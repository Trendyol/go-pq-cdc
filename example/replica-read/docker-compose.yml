# Primary + two synchronous standbys (ANY 2). standby2 applies commit records
# 3s late (recovery_min_apply_delay), so every event arrives while that standby
# sits exactly at CommitLSN: the boundary the strict replay rule is about.
x-standby: &standby
  image: postgres:17-alpine
  user: postgres
  entrypoint: [ "sh", "-ec" ]
  environment:
    PGPASSWORD: cdc_pass
  depends_on:
    primary:
      condition: service_healthy
  healthcheck:
    test: [ "CMD-SHELL", "pg_isready -U cdc_user -d cdc_db" ]
    interval: 2s
    timeout: 5s
    retries: 30

services:
  primary:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cdc_db
      POSTGRES_USER: cdc_user
      POSTGRES_PASSWORD: cdc_pass
    ports:
      - "5437:5432"
    command: [ "postgres", "-c", "wal_level=logical", "-c", "wal_keep_size=64MB" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cdc_user -d cdc_db" ]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh

  standby1:
    <<: *standby
    ports:
      - "5438:5432"
    command:
      - |
        pg_basebackup -h primary -U cdc_user -D "$$PGDATA" -R -X stream -C -S standby1 && chmod 700 "$$PGDATA"
        exec postgres -c primary_conninfo='host=primary user=cdc_user password=cdc_pass application_name=standby1'

  standby2:
    <<: *standby
    ports:
      - "5439:5432"
    command:
      - |
        pg_basebackup -h primary -U cdc_user -D "$$PGDATA" -R -X stream -C -S standby2 && chmod 700 "$$PGDATA"
        exec postgres -c recovery_min_apply_delay=3s -c primary_conninfo='host=primary user=cdc_user password=cdc_pass application_name=standby2'
