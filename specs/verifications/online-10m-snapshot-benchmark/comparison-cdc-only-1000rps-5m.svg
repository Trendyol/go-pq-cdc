<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">Legacy versus online CDC: 1000 inserts per second for five minutes</title>
<desc id="desc">Both connectors delivered 300001 CDC events and stopped on the same sentinel. Throughput and stop times were effectively equal. Online sampled lower peak retained WAL, confirmed lag, and feedback age. No snapshot rows were delivered.</desc>
<rect width="1440" height="1050" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#536078}.label{font-size:19px;font-weight:700}.value{font-size:17px;font-weight:700}.note{font-size:15px;fill:#536078}.result{font-size:18px;font-weight:700;fill:#087b52}</style>
<text x="48" y="52" class="title">CDC-only comparison — legacy and online at 1,000 RPS</text>
<text x="48" y="84" class="sub">One shared PostgreSQL 16 source · 300 seconds · 300,000 INSERT transactions + one sentinel</text>
<text x="48" y="112" class="sub">Legacy snapshot disabled; online empty snapshot completed before timing. Zero snapshot READ rows.</text>
<rect x="48" y="134" width="1344" height="56" rx="9" fill="#eaf7ef"/>
<text x="68" y="168" class="result">PASS: 300,001 deliveries each · same sentinel commit LSN 0/56C4958 · both kept up with input</text>
<rect x="48" y="211" width="18" height="18" rx="3" fill="#172033"/>
<text x="76" y="226" class="note">Legacy CDC</text>
<rect x="228" y="211" width="18" height="18" rx="3" fill="#dc3b32"/>
<text x="256" y="226" class="note">Online CDC</text>
<text x="480" y="226" class="note">Each row has its own linear scale. WAL values are sampled peaks, not final lag.</text>
<text x="48" y="287" class="label">Stop at sentinel</text>
<text x="48" y="311" class="note">seconds</text>
<rect x="365" y="263" width="510" height="25" rx="4" fill="#f1f3f6"/>
<rect x="365" y="263" width="510.000" height="25" rx="4" fill="#172033"/>
<text x="895" y="282" class="value">300.019726 s</text>
<rect x="365" y="299" width="510" height="25" rx="4" fill="#f1f3f6"/>
<rect x="365" y="299" width="510.000" height="25" rx="4" fill="#dc3b32"/>
<text x="895" y="318" class="value">300.019759 s</text>
<text x="1165" y="305" class="note">Effectively equal</text>
<line x1="48" y1="350" x2="1392" y2="350" stroke="#e5e9ef"/>
<text x="48" y="392" class="label">Delivery rate over run</text>
<text x="48" y="416" class="note">events/s</text>
<rect x="365" y="368" width="510" height="25" rx="4" fill="#f1f3f6"/>
<rect x="365" y="368" width="510.000" height="25" rx="4" fill="#172033"/>
<text x="895" y="387" class="value">999.94 events/s</text>
