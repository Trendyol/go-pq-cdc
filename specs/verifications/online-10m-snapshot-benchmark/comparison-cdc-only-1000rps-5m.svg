<text x="68" y="930" class="note">Guard disabled: no per-transaction visibility SQL; schema catalog validation at startup, Relation-driven CDC afterward.</text>
<text x="68" y="953" class="note">Shared process only: peak heap 4.36 MB · peak RSS 36.19 MB. Not attributable to either arm separately.</text>
<text x="68" y="976" class="note">Single local counting-handler run, no durable target. This does not measure maximum throughput or prove production readiness.</text>
<text x="68" y="999" class="note">Source: evidence/cdc-only-1000rps-5m.json · feedback sampled every 2 seconds; stop timestamps include polling delay.</text>
