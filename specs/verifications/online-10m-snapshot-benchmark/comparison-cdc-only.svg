<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" role="img" aria-labelledby="title desc">
<title id="title">CDC-only head-to-head at 1000 events/s: no snapshot in either arm</title>
<desc id="desc">Legacy snapshot disabled and online snapshot vacuous (empty table, zero READs). Both arms stream pure CDC from one shared PostgreSQL 16 source, 1000 inserts per second for 2 minutes plus one sentinel insert, stopped on the same sentinel commit LSN.</desc>
<rect width="1240" height="930" fill="#ffffff"/>
<style><![CDATA[text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;fill:#111827}.title{font-size:29px;font-weight:750}.subtitle{font-size:15px;fill:#4b5563}.label{font-size:17px;font-weight:650}.small{font-size:13px;fill:#4b5563}.value{font-size:14px;font-weight:650}.axis{stroke:#e5e7eb;stroke-width:1}.legacy{fill:#111827}.online{fill:#dc2626}.note{font-size:14px;fill:#374151}.ok{fill:#047857;font-weight:650}]]></style>
<text x="60" y="50" class="title">CDC-only, no snapshot: legacy keeps line rate, online does not</text>
<text x="60" y="78" class="subtitle">Shared source · PostgreSQL 16-alpine · 1,000 inserts/s × 2 min + 1 sentinel insert · legacy snapshot.enabled=false · online snapshot vacuous (empty table)</text>
<text x="60" y="104" class="subtitle">Zero snapshot rows delivered by either arm (online ReadQueries=1, empty window) — this isolates the CDC capture paths only</text>
<text x="60" y="130" class="subtitle">Sentinel barrier: both arms delivered it exactly once, same commit LSN 0/322E9E0 → <tspan class="ok">ok</tspan> · each arm 120,001 deliveries = 120,000 inserts + sentinel</text>
<text x="60" y="156" class="subtitle">Writers ran 120s at 1000 tx/s; legacy stop latency after sentinel commit: 46 ms</text>
<rect x="60" y="176" width="18" height="18" rx="3" class="legacy"/><text x="88" y="190" class="small">legacy consistent (CDC-only)</text>
<rect x="330" y="176" width="18" height="18" rx="3" class="online"/><text x="358" y="190" class="small">online (pure CDC tail)</text>
<line x1="305" y1="196" x2="915" y2="196" class="axis"/>
<text x="60" y="262" class="label">Stop at sentinel</text>
<text x="60" y="283" class="small">seconds · lower better</text>
<rect x="305" y="240" width="610" height="1" fill="#f3f4f6"/>
<rect x="305" y="250" width="144.3" height="24" rx="4" class="legacy"/>
<rect x="305" y="284" width="610.0" height="24" rx="4" class="online"/>
<text x="459.3" y="268" class="value">120.048 seconds</text>
<text x="925.0" y="302" class="value">507.630 seconds</text>
<text x="935" y="283" class="small">online / legacy = 4.23×</text>
<text x="60" y="344" class="label">CDC delivery rate over run</text>
<text x="60" y="365" class="small">events/s · higher better</text>
<rect x="305" y="322" width="610" height="1" fill="#f3f4f6"/>
<rect x="305" y="332" width="610.0" height="24" rx="4" class="legacy"/>
<rect x="305" y="366" width="144.3" height="24" rx="4" class="online"/>
<text x="925.0" y="350" class="value">999.6 events/s</text>
<text x="459.3" y="384" class="value">236.4 events/s</text>
<text x="935" y="365" class="small">legacy / online = 4.23×</text>
<text x="60" y="426" class="label">Peak slot-retained WAL</text>
<text x="60" y="447" class="small">MB · lower better</text>
<rect x="305" y="404" width="610" height="1" fill="#f3f4f6"/>
<rect x="305" y="414" width="296.8" height="24" rx="4" class="legacy"/>
<rect x="305" y="448" width="610.0" height="24" rx="4" class="online"/>
<text x="611.8" y="432" class="value">13.66 MB</text>
<text x="925.0" y="466" class="value">28.07 MB</text>
<text x="935" y="447" class="small">online / legacy = 2.06×</text>
<text x="60" y="508" class="label">Peak confirmed lag</text>
<text x="60" y="529" class="small">MB · lower better</text>
<rect x="305" y="486" width="610" height="1" fill="#f3f4f6"/>
<rect x="305" y="496" width="305.5" height="24" rx="4" class="legacy"/>
<rect x="305" y="530" width="610.0" height="24" rx="4" class="online"/>
<text x="620.5" y="514" class="value">10.24 MB</text>
<text x="925.0" y="548" class="value">20.45 MB</text>
<text x="935" y="529" class="small">online / legacy = 2.00×</text>
<text x="60" y="590" class="label">Peak feedback age</text>
<text x="60" y="611" class="small">seconds · lower better</text>
<rect x="305" y="568" width="610" height="1" fill="#f3f4f6"/>
<rect x="305" y="578" width="610.0" height="24" rx="4" class="legacy"/>
<rect x="305" y="612" width="24.6" height="24" rx="4" class="online"/>
<text x="925.0" y="596" class="value">28.195 seconds</text>
<text x="339.6" y="630" class="value">1.139 seconds</text>
<text x="935" y="611" class="small">online / legacy = 0.04×</text>
<text x="60" y="672" class="label">CDC deliveries (inserts+sentinel)</text>
<text x="60" y="693" class="small">events · equal better</text>
<rect x="305" y="650" width="610" height="1" fill="#f3f4f6"/>
<rect x="305" y="660" width="610.0" height="24" rx="4" class="legacy"/>
<rect x="305" y="694" width="610.0" height="24" rx="4" class="online"/>
<text x="925.0" y="678" class="value">120,001 events</text>
<text x="925.0" y="712" class="value">120,001 events</text>
<text x="935" y="693" class="small">identical — fairness gate</text>
<rect x="60" y="756" width="1120" height="140" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="86" y="786" class="note">Fairness gate holds: equal 120,001 deliveries and one shared sentinel commit LSN prove both arms consumed the identical stream and stopped on the same message.</text>
<text x="86" y="811" class="note">Bottleneck isolated: snapshot cost removed from both sides — legacy absorbs 1,000 events/s at line rate; online drains ~236/s avg → 4.23× to stop.</text>
<text x="86" y="836" class="note">Online’s ceiling is the coordinator loop itself (per-envelope decode + cdc_online Store round-trips + synchronous handler), not snapshot/CDC interaction.</text>
<text x="86" y="861" class="note">Feedback nuance: online’s acks are 25× fresher (1.1s vs 28.2s) but come from ~20 MB behind head, so its slot retains ~2× more WAL.</text>
<text x="86" y="886" class="note">Caveat: single local run, 6 GB VM, durable-target-free counting handler; legacy confirms in keepalive bursts hence stale-age-but-small-lag.</text>
</svg>